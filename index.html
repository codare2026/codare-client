<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Co-Dare 口袋營養獅｜學員專區</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script>
// 救援模式（網址加 ?recover）：停止載入 app，不同步、不覆蓋，只讀出本機暫存的回覆並另存備份
if (new URLSearchParams(location.search).has('recover')) {
  window.stop();
  (function () {
    const SBU = 'https://iqfnbwyjehwdbxptquyr.supabase.co';
    const SBK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxZm5id3lqZWh3ZGJ4cHRxdXlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODU5MjcsImV4cCI6MjA5MjM2MTkyN30.F5XSv6TKkJfek8bLmYsgvYgD7cnLGLirpNwC7SqbNDY';
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fbCount = v => {
      if (!v || typeof v !== 'object') return 0;
      let n = (Array.isArray(v.rdFeedbacks) ? v.rdFeedbacks.length : 0) + (v.rdFeedback ? 1 : 0);
      Object.keys(v).forEach(k => { if (k.endsWith('_rdFeedbacks') && Array.isArray(v[k])) n += v[k].length; });
      return n;
    };
    const found = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !(k.startsWith('cd_food_') || k.startsWith('cd_pending_food_'))) continue;
      let v; try { v = JSON.parse(localStorage.getItem(k)); } catch { continue; }
      if (k.startsWith('cd_pending_')) v = v && v.val;
      const n = fbCount(v);
      if (n > 0) found.push({ k, v, n });
    }
    found.sort((a, b) => a.k.localeCompare(b.k));
    const texts = v => {
      const out = [];
      (v.rdFeedbacks || []).forEach(f => out.push('【整日】' + (f.text || '')));
      Object.keys(v).forEach(k => { if (k.endsWith('_rdFeedbacks') && Array.isArray(v[k])) v[k].forEach(f => out.push('【' + k.replace('_rdFeedbacks', '') + '】' + (f.text || ''))); });
      return out;
    };
    const render = () => {
      document.documentElement.innerHTML = `<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資料救援</title></head>
      <body style="font-family:-apple-system,'Noto Sans TC',sans-serif;margin:0;padding:20px;background:#f4fbfa;color:#1f2937">
        <h2 style="color:#0f9c8f;margin:0 0 6px">資料救援模式</h2>
        <p style="font-size:14px;color:#64748b;margin:0 0 16px">這個頁面只會讀取這台裝置裡的暫存，不會改動任何現有紀錄。</p>
        ${found.length ? `<button id="rc-up" style="width:100%;padding:14px;border:none;border-radius:12px;background:#0f9c8f;color:#fff;font-size:16px;font-weight:700;margin-bottom:16px">上傳備份給營養師（共 ${found.length} 天）</button><div id="rc-msg" style="font-size:14px;margin-bottom:16px"></div>` : `<div style="padding:16px;background:#fff;border-radius:12px">這台裝置裡沒有找到含營養師回覆的暫存紀錄。</div>`}
        ${found.map(f => `<div style="background:#fff;border-radius:12px;padding:14px;margin-bottom:12px">
          <div style="font-weight:700;margin-bottom:6px">${esc(f.k.replace('cd_pending_', '待補寫 ').replace('cd_food_', ''))}（${f.n} 則回覆）</div>
          ${texts(f.v).map(t => `<div style="font-size:13px;line-height:1.6;white-space:pre-wrap;border-top:1px solid #eef2f7;padding:6px 0">${esc(t)}</div>`).join('')}
        </div>`).join('')}
      </body>`;
      const btn = document.getElementById('rc-up');
      if (!btn) return;
      btn.onclick = async () => {
        btn.disabled = true; btn.textContent = '上傳中…';
        const stamp = Date.now();
        let ok = 0;
        for (const f of found) {
          try {
            const res = await fetch(SBU + '/rest/v1/cd', {
              method: 'POST',
              headers: { apikey: SBK, Authorization: 'Bearer ' + SBK, 'Content-Type': 'application/json' },
              body: JSON.stringify({ key: 'recovery_' + stamp + '_' + f.k, value: { sourceKey: f.k, savedAt: new Date().toISOString(), ua: navigator.userAgent, data: f.v }, updated_at: new Date().toISOString() })
            });
            if (res.ok) ok++;
          } catch {}
        }
        document.getElementById('rc-msg').innerHTML = ok === found.length
          ? '<b style="color:#0f9c8f">✅ 備份已上傳，可以關閉這個頁面了，謝謝！</b>'
          : `<b style="color:#ef4444">上傳 ${ok}/${found.length} 筆，請截圖這個畫面傳給營養師。</b>`;
        btn.textContent = '已上傳';
      };
    };
    setTimeout(render, 0);
  })();
  throw new Error('recover mode');
}
// ── Supabase 設定 ──
const SB_URL  = 'https://iqfnbwyjehwdbxptquyr.supabase.co';
const SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxZm5id3lqZWh3ZGJ4cHRxdXlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODU5MjcsImV4cCI6MjA5MjM2MTkyN30.F5XSv6TKkJfek8bLmYsgvYgD7cnLGLirpNwC7SqbNDY';
const SB_HDRS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' };

const _cache = {};
let _sbReady = true;
let _realtimeChannel = null;

// ── 讀取（先 cache → localStorage，背景同步） ──
function gs(key) {
  if (_cache[key] !== undefined) return _cache[key];
  try { const v = localStorage.getItem('cd_' + key); return v ? JSON.parse(v) : null; } catch { return null; }
}

// ── 寫入（cache + localStorage + Supabase 非同步） ──
const _inFlightWrites = new Set(); // 正在寫入 Supabase 過程中的 key，防止背景同步用舊資料蓋掉剛寫入的新資料
function ss(key, val) {
  const hadLocal = _cache[key] !== undefined && _cache[key] !== null;
  _cache[key] = val;
  try { if (val === null) localStorage.removeItem('cd_' + key); else localStorage.setItem('cd_' + key, JSON.stringify(val)); } catch {}
  _inFlightWrites.add(key);
  const w = (_isMergeKey(key) && _isPlainObj(val)) ? sbMergeWrite(key, val, hadLocal) : sbWrite(key, val);
  w.finally(() => { _inFlightWrites.delete(key); });
}

const _pendingWrites = {};

async function sbWrite(key, val) {
  try {
    if (val === null) {
      await fetch(`${SB_URL}/rest/v1/cd?key=eq.${encodeURIComponent(key)}`, { method: 'DELETE', headers: SB_HDRS });
    } else {
      const res = await fetch(`${SB_URL}/rest/v1/cd`, {
        method: 'POST',
        headers: { ...SB_HDRS, 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify({ key, value: val, updated_at: new Date().toISOString() })
      });
      if (!res.ok) throw new Error('write failed');
    }
    delete _pendingWrites[key];
    try { localStorage.removeItem('cd_pending_' + key); } catch {}
  } catch(e) {
    console.warn('寫入失敗，加入待寫入隊列:', key);
    _pendingWrites[key] = { val, at: new Date().toISOString() };
    try { localStorage.setItem('cd_pending_' + key, JSON.stringify({ val, at: new Date().toISOString() })); } catch {}
  }
}


// ══════════ 安全寫入：飲食紀錄只送出「有變動的欄位」，由資料庫合併 ══════════
// 學員端和營養師後台都會改同一天的紀錄；整包寫回時，手上版本若比較舊就會蓋掉對方的內容。
// 這裡記住「上次從雲端拿到的版本」各欄位的指紋，存檔時只送出跟它不同的欄位。
function _isMergeKey(key) { return typeof key === 'string' && key.startsWith('food_'); }
function _isPlainObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
function _stableStr(v) {
  if (v === undefined) return 'null';
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(_stableStr).join(',') + ']';
  return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + _stableStr(v[k])).join(',') + '}';
}
function _hashStr(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36) + s.length.toString(36);
}
function _fieldHashes(obj) {
  const o = {};
  Object.keys(obj || {}).forEach(k => { if (obj[k] !== undefined) o[k] = _hashStr(_stableStr(obj[k])); });
  return o;
}
const _baseHashes = {};
// 每次「用雲端資料更新本機」時呼叫，記住雲端版本
function _noteServerValue(key, value) {
  if (!_isMergeKey(key)) return;
  if (!_isPlainObj(value)) {
    delete _baseHashes[key];
    try { localStorage.removeItem('cdh_' + key); } catch {}
    return;
  }
  const h = _fieldHashes(value);
  _baseHashes[key] = h;
  try { localStorage.setItem('cdh_' + key, JSON.stringify(h)); } catch {}
}
function _getBase(key) {
  if (_baseHashes[key]) return _baseHashes[key];
  try {
    if (localStorage.getItem('cd_' + key) === null) return null;
    const s = localStorage.getItem('cdh_' + key);
    if (s) return (_baseHashes[key] = JSON.parse(s));
  } catch {}
  return null;
}
// undefined = 讀取失敗；null = 雲端沒有這筆
async function _fetchServerValue(key) {
  try {
    const res = await Promise.race([
      fetch(`${SB_URL}/rest/v1/cd?key=eq.${encodeURIComponent(key)}&select=value`, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } }),
      new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 8000))
    ]);
    if (!res.ok) return undefined;
    const rows = await res.json();
    return rows[0] ? rows[0].value : null;
  } catch { return undefined; }
}
let _patchRpcMissing = false;
// 回傳 true 代表已確認寫進雲端；失敗會放進待補寫隊列，之後自動重試
async function sbMergeWrite(key, val, allowRemove = true) {
  try {
    let base = _getBase(key);
    let srv;
    if (!base) {
      // 不知道雲端目前長怎樣 → 先讀，讀不到就先不寫（寧可晚點補寫，也不要蓋掉資料）
      srv = await _fetchServerValue(key);
      if (srv === undefined) throw new Error('cannot read latest');
      base = _isPlainObj(srv) ? _fieldHashes(srv) : {};
      allowRemove = false;
    }
    const cur = _fieldHashes(val);
    const patch = {}, remove = [];
    Object.keys(cur).forEach(k => { if (cur[k] !== base[k]) patch[k] = val[k]; });
    if (allowRemove) Object.keys(base).forEach(k => { if (!(k in cur)) remove.push(k); });

    let merged;
    if (!Object.keys(patch).length && !remove.length) {
      merged = _isPlainObj(srv) ? srv : null;
    } else {
      if (!_patchRpcMissing) {
        const res = await fetch(`${SB_URL}/rest/v1/rpc/cd_patch`, {
          method: 'POST',
          headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_key: key, p_patch: patch, p_remove: remove })
        });
        if (res.ok) merged = await res.json();
        else if (res.status === 404) _patchRpcMissing = true;
        else throw new Error('patch failed ' + res.status);
      }
      if (merged === undefined) {
        // 資料庫還沒裝合併功能：先讀雲端最新版本，把這次的變動套上去再寫回
        if (srv === undefined) srv = await _fetchServerValue(key);
        if (srv === undefined) throw new Error('cannot read latest');
        merged = { ...(_isPlainObj(srv) ? srv : {}), ...patch };
        remove.forEach(k => { delete merged[k]; });
        const res2 = await fetch(`${SB_URL}/rest/v1/cd`, {
          method: 'POST',
          headers: { ...SB_HDRS, 'Prefer': 'resolution=merge-duplicates' },
          body: JSON.stringify({ key, value: merged, updated_at: new Date().toISOString() })
        });
        if (!res2.ok) throw new Error('write failed');
      }
    }
    if (_isPlainObj(merged)) {
      _noteServerValue(key, merged);
      // 這段期間本機沒有再改過，就換成雲端合併後的完整版本（會包含對方剛寫的內容）
      if (_cache[key] === val) {
        _cache[key] = merged;
        try { localStorage.setItem('cd_' + key, JSON.stringify(merged)); } catch {}
      }
    }
    delete _pendingWrites[key];
    try { localStorage.removeItem('cd_pending_' + key); } catch {}
    return true;
  } catch (e) {
    console.warn('寫入失敗，加入待寫入隊列:', key, e.message);
    _pendingWrites[key] = { val, at: new Date().toISOString() };
    try { localStorage.setItem('cd_pending_' + key, JSON.stringify({ val, at: new Date().toISOString() })); } catch {}
    return false;
  }
}

async function flushPendingWrites() {
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('cd_pending_')) {
        const key = k.slice('cd_pending_'.length);
        if (!_pendingWrites[key]) {
          try { _pendingWrites[key] = JSON.parse(localStorage.getItem(k)); } catch {}
        }
      }
    }
  } catch {}

  const keys = Object.keys(_pendingWrites);
  if (!keys.length) return;

  showToast(`🔄 補寫 ${keys.length} 筆離線資料中…`);
  for (const key of keys) {
    const { val } = _pendingWrites[key];
    if (_isMergeKey(key) && _isPlainObj(val)) await sbMergeWrite(key, val, false);
    else await sbWrite(key, val);
    await new Promise(r => setTimeout(r, 50));
  }
  showToast('✅ 離線資料已全部同步！');
}

// ── 上傳圖片到 Supabase Storage（取代 base64 存資料庫）──
async function uploadPhoto(file, userId, day, mealKey) {
  const ext = file.type === 'image/png' ? 'png' : 'jpg';
  const path = `${userId}/${day.replace(/\//g,'_')}/${mealKey}_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const res = await fetch(`${SB_URL}/storage/v1/object/photos/${path}`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': file.type, 'x-upsert': 'true' },
    body: file
  });
  if (!res.ok) throw new Error('上傳失敗');
  return `${SB_URL}/storage/v1/object/public/photos/${path}`;
}

// ── 從 localStorage 預載 cache（瞬間啟動）──
function preloadLocalCache() {
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith('cd_')) {
        const k = key.slice(3);
        if (_cache[k] === undefined) {
          try { _cache[k] = JSON.parse(localStorage.getItem(key)); } catch {}
        }
      }
    }
  } catch(e) {}
}

// ── warmCache：增量同步，節省流量 ──
async function warmCache(userId) {
  preloadLocalCache();
  if (!userId) return;

  const GET_HDRS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };

  const safeGet = async (url) => {
    try {
      const res = await Promise.race([
        fetch(url, { headers: GET_HDRS }),
        new Promise((_, r) => setTimeout(() => r(new Error('t')), 6000))
      ]);
      if (!res.ok) return [];
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    } catch(e) { return []; }
  };

  const lastSyncKey = 'cd_last_sync_' + userId;
  const lastSync = localStorage.getItem(lastSyncKey);
  const now = new Date().toISOString();

  let rows;
  if (lastSync) {
    // 增量：只抓上次同步後有變動的（例如營養師新增回覆）
    rows = await safeGet(
      `${SB_URL}/rest/v1/cd?updated_at=gt.${encodeURIComponent(lastSync)}&key=ilike.%25${userId}%25&select=key,value&limit=200&order=updated_at`
    );
  } else {
    // 第一次：抓此學員所有資料
    rows = await safeGet(
      `${SB_URL}/rest/v1/cd?key=ilike.%25${userId}%25&select=key,value&limit=300`
    );
  }

rows.forEach(({ key, value }) => {
    if (!key) return;
    if (_pendingWrites[key]) return;
    if (_inFlightWrites.has(key)) return; // 該 key 正在寫入中，跳過避免用舊資料覆蓋剛寫入的新資料
    _cache[key] = value;
    _noteServerValue(key, value);
    try { localStorage.setItem('cd_' + key, JSON.stringify(value)); } catch {}
  });

  if (rows.length >= 0) localStorage.setItem(lastSyncKey, now);
}

// ── bgSyncClient：背景更新，不阻塞 UI ──
function bgSyncClient(userId) {
  if (!userId) return;
  setTimeout(async () => {
    try { await warmCache(userId); updateInboxBadge(); } catch(e) {}
  }, 300);
}

// ── Realtime 監聽（Supabase Realtime）──
function updateFoodStatusDots(userId) {
  // 只更新首頁日期格的紅點/綠勾，不重新渲染整頁
  const days = buildCourseDates(currentUser.start, currentUser.end);
  days.forEach(day => {
    const food = gs(`food_${userId}_${day}`);
    if (!food) return;
    const dotEl = document.getElementById(`day-dot-${day.replace(/\//g,'-')}`);
    if (!dotEl) return;
    const hasFb = Array.isArray(food.rdFeedbacks) ? food.rdFeedbacks.length > 0 : !!food.rdFeedback;
    const done = food.rdFeedbackDone;
    if (done) {
      dotEl.style.background = '#22c55e';
      dotEl.title = '營養師已完成回饋';
    } else if (hasFb) {
      dotEl.style.background = '#0d9488';
      dotEl.title = '有新回饋';
    } else if (food.hasData || food.notified) {
      dotEl.style.background = '#f59e0b';
      dotEl.title = '已上傳';
    }
  });
  // 如果現在在飲食日記頁，更新回饋泡泡
  if (currentFoodDay) {
    const feedbackArea = document.getElementById('rd-feedback-area');
    if (feedbackArea) {
      const food = gs(`food_${userId}_${currentFoodDay}`);
      if (food) feedbackArea.innerHTML = renderFeedbackBubbles(food);
    }
  }
}
function startRealtimeSync(userId) {
  if (_realtimeChannel) return;
  try {
    // 使用 Supabase Realtime via WebSocket
    const wsUrl = `${SB_URL.replace('https','wss')}/realtime/v1/websocket?apikey=${SB_KEY}&vsn=1.0.0`;
    const ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      ws.send(JSON.stringify({ topic: 'realtime:public:cd', event: 'phx_join', payload: {}, ref: '1' }));
    };
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.event === 'postgres_changes' || msg.event === 'INSERT' || msg.event === 'UPDATE') {
          const record = msg.payload?.record || msg.payload?.new;
          if (record?.key && record.key.startsWith(`food_${userId}`) && !_pendingWrites[record.key] && !_inFlightWrites.has(record.key)) {
            _cache[record.key] = record.value;
            _noteServerValue(record.key, record.value);
            try { localStorage.setItem('cd_' + record.key, JSON.stringify(record.value)); } catch {}
            updateInboxBadge();
            updateFoodStatusDots(userId);
          }
          if (record?.key?.startsWith(`inbox_${userId}`)) {
            _cache[record.key] = record.value;
            try { localStorage.setItem('cd_' + record.key, JSON.stringify(record.value)); } catch {}
            updateInboxBadge();
            if (currentPage === 'home') document.getElementById('main-content').innerHTML = renderHome();
          }
        }
      } catch(e) {}
    };
    _realtimeChannel = ws;
  } catch(e) { console.warn('Realtime init failed:', e.message); }
}
</script>

  --radius-sm: 11px;
  --radius-lg: 26px;
  --shadow: 0 1px 2px rgba(15,23,42,0.05), 0 3px 10px rgba(20,184,166,0.07);
  --shadow-md: 0 10px 28px rgba(20,184,166,0.14), 0 2px 8px rgba(15,23,42,0.05);
  --shadow-lg: 0 20px 52px rgba(15,156,143,0.20), 0 6px 16px rgba(15,23,42,0.07);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: linear-gradient(180deg, #f3f7ff 0%, #f7fafd 45%, #f6f8fb 100%);
  background-attachment: fixed;
  color: var(--gray-800);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── 全域動畫 ── */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes ripple {
  0%   { transform: scale(0); opacity: 0.4; }
  100% { transform: scale(2.5); opacity: 0; }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50%       { transform: scale(1.05); }
}
@keyframes shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes bounceIn {
  0%   { transform: scale(0.85); opacity: 0; }
  60%  { transform: scale(1.05); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes floatBlob {
  0%, 100% { transform: translate(0,0) scale(1); }
  50%      { transform: translate(-4%, 5%) scale(1.06); }
}

/* ── LOGIN ── */
#login-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
  position: relative;
  overflow-x: hidden;
}
.login-hero {
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  background: linear-gradient(160deg, var(--sky) 0%, var(--teal) 60%, #0f9c8f 100%);
  padding: 64px 24px 74px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.login-hero::before {
  content: '';
  position: absolute;
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
  top: -80px; right: -60px;
  border-radius: 50%;
  animation: floatBlob 12s ease-in-out infinite;
}
.login-hero::after {
  content: '';
  position: absolute;
  width: 190px; height: 190px;
  background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, transparent 70%);
  bottom: -55px; left: -45px;
  border-radius: 50%;
  animation: floatBlob 14s ease-in-out infinite reverse;
}
.login-hero-logo {
  width: 148px;
  height: auto;
  filter: drop-shadow(0 10px 24px rgba(0,0,0,0.22));
  animation: bounceIn 0.6s var(--ease);
  position: relative;
  z-index: 1;
}
.login-hero-sub {
  margin-top: 10px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.4px;
  color: rgba(255,255,255,0.9);
  position: relative;
  z-index: 1;
  animation: fadeUp 0.5s var(--ease) 0.15s both;
}
.login-sheet {
  flex: 1;
  background: #fff;
  border-radius: 28px 28px 0 0;
  margin-top: -26px;
  position: relative;
  z-index: 2;
  padding: 36px 24px 44px;
  box-shadow: 0 -10px 28px rgba(15,23,42,0.07);
  animation: fadeUp 0.5s var(--ease) 0.25s both;
}
.login-card { max-width: 380px; width: 100%; margin: 0 auto; }
.login-card h2 { font-size: 19px; font-weight: 800; margin-bottom: 24px; color: var(--gray-800); letter-spacing: 0.2px; text-align: center; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--gray-500);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.input-wrap { position: relative; }
.input-icon {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  opacity: 0.5;
  pointer-events: none;
}
.form-group input {
  width: 100%;
  padding: 14px 18px 14px 42px;
  border: none;
  border-radius: 999px;
  font-size: 15px;
  font-family: inherit;
  background: var(--gray-100);
  transition: box-shadow 0.2s var(--ease), background 0.2s var(--ease);
  outline: none;
}
.form-group input:focus {
  background: var(--teal-light);
  box-shadow: 0 0 0 3px rgba(20,184,166,0.28);
}
.btn-primary {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--teal) 0%, #0f9c8f 100%);
  color: #fff;
  border: none;
  border-radius: 999px;
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease), filter 0.15s;
  margin-top: 6px;
  box-shadow: 0 10px 24px rgba(15,156,143,0.32);
  position: relative;
  overflow: hidden;
}
.btn-primary:hover { filter: brightness(1.05); }
.btn-primary:active {
  transform: scale(0.97);
  box-shadow: 0 3px 10px rgba(15,156,143,0.3);
}
.login-error { color: var(--red); font-size: 13px; font-weight: 500; margin-top: 12px; text-align: center; display: none; }
.login-hint { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--gray-100); font-size: 12px; color: var(--gray-400); text-align: center; }

/* ── APP SHELL ── */
#app { display: none; flex-direction: column; min-height: 100vh; }

.topbar {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border-bottom: 1px solid rgba(20,184,166,0.08);
  padding: 0 16px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(15,156,143,0.06);
}
.topbar-brand {
  font-size: 17px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary-dark), var(--sky));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.topbar-user { display: flex; align-items: center; gap: 8px; }
.topbar-name { font-size: 13px; color: var(--gray-700); font-weight: 600; }
.btn-logout {
  background: none;
  border: 1.5px solid var(--gray-200);
  border-radius: 9px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--gray-500);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s var(--ease);
}
.settings-wrap { position: relative; }
.btn-settings {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: var(--gray-100);
  border: none;
  border-radius: 12px;
  color: var(--gray-600);
  cursor: pointer;
  transition: all 0.15s var(--ease);
}
.btn-settings:active { transform: scale(0.94); background: var(--gray-200); }
.settings-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 150px;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 12px 32px rgba(15,23,42,0.16);
  padding: 6px;
  display: flex;
  flex-direction: column;
  z-index: 200;
}
.settings-menu[hidden] { display: none; }
.settings-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 11px 12px;
  background: none;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  color: var(--gray-700);
  cursor: pointer;
  text-align: left;
}
.settings-item:active { background: var(--gray-100); }
.settings-item-danger { color: var(--red); }
.btn-logout:hover { border-color: var(--gray-300); color: var(--gray-700); }
.btn-logout:active { background: var(--gray-100); transform: scale(0.96); }
.btn-sync {
  background: linear-gradient(135deg, var(--primary-light), #fff);
  border: 1.5px solid rgba(20,184,166,0.28);
  border-radius: 9px;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--primary);
  cursor: pointer;
  font-family: inherit;
  font-weight: 700;
  transition: all 0.15s var(--ease);
}
.btn-sync:active { background: var(--primary-light); transform: scale(0.96); }

.content {
  flex: 1;
  padding: 16px;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
  padding-bottom: 100px;
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px) saturate(170%);
  -webkit-backdrop-filter: blur(20px) saturate(170%);
  border-top: 1px solid rgba(20,184,166,0.08);
  display: flex;
  align-items: stretch;
  z-index: 100;
  padding: 6px 6px calc(env(safe-area-inset-bottom) + 8px);
  box-shadow: 0 -6px 24px rgba(15,156,143,0.08);
  overflow: visible;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 7px 2px 6px;
  background: none;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  font-family: inherit;
  color: var(--gray-400);
  gap: 3px;
  transition: color 0.25s var(--ease), transform 0.35s cubic-bezier(0.34,1.56,0.64,1), background 0.25s var(--ease);
  position: relative;
}
.nav-item.active { color: var(--primary-dark); background: var(--primary-light); }
.nav-item.active .nav-icon { transform: scale(1.12); color: var(--primary-dark); }
.nav-item:active { transform: scale(0.88); }
.nav-icon { line-height: 1; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), color 0.25s var(--ease); display: flex; }
.nav-icon svg { width: 22px; height: 22px; display: block; }
.nav-label { font-size: 10px; font-weight: 700; letter-spacing: 0.2px; transition: color 0.25s var(--ease); }
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 2px; left: 50%;
  transform: translateX(-50%);
  width: 22px; height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--sky));
  border-radius: 0 0 3px 3px;
  transition: width 0.25s var(--ease);
}

/* ── NAV FAB（飲食／加入紀錄）── */
.nav-fab { justify-content: flex-start; padding-top: 0; overflow: visible; }
.nav-fab-icon {
  width: 54px; height: 54px;
  margin-top: -26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(150deg, rgba(148,233,214,0.95) 0%, rgba(20,184,166,0.95) 48%, rgba(20,184,166,0.95) 100%);
  border: 1px solid rgba(255,255,255,0.55);
  box-shadow: 0 12px 26px rgba(20,184,166,0.4), 0 4px 10px rgba(15,156,143,0.22), inset 0 1px 1px rgba(255,255,255,0.55);
  backdrop-filter: blur(6px) saturate(160%);
  -webkit-backdrop-filter: blur(6px) saturate(160%);
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s var(--ease);
}
.nav-fab-icon svg { width: 25px; height: 25px; }
.nav-fab-label { margin-top: 4px; color: var(--teal); }
.nav-fab:active .nav-fab-icon { transform: scale(0.86); box-shadow: 0 6px 16px rgba(20,184,166,0.35), 0 2px 6px rgba(15,156,143,0.2), inset 0 1px 1px rgba(255,255,255,0.5); }
.nav-fab.active { background: none; }
.nav-fab.active .nav-label { color: var(--teal); }
.nav-fab::before { content: none; }

/* ── CARDS ── */
.card {
  background: #fff;
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
  border: none;
  animation: fadeUp 0.35s var(--ease) both;
}
.card-tap { cursor: pointer; transition: filter 0.15s var(--ease), transform 0.15s var(--ease); }
.card-tap:active { filter: brightness(1.07); transform: scale(0.99); }
.card-title { font-size: 16px; font-weight: 700; color: var(--gray-800); margin-bottom: 12px; letter-spacing: 0.1px; }
.page-title { font-size: 23px; font-weight: 900; color: var(--gray-900); margin-bottom: 16px; letter-spacing: 0.1px; }
.notice {
  background: var(--amber-light);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 500;
  color: #92400e;
  margin-bottom: 16px;
}
.notice-blue {
  background: var(--primary-light);
  color: var(--primary-dark);
}

/* ── HOME ── */
.home-header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 55%, var(--primary-deep) 100%);
  border-radius: var(--radius-lg);
  padding: 24px 22px;
  color: #fff;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.home-header::before {
  content: '';
  position: absolute;
  width: 180px; height: 180px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
  top: -50px; right: -50px;
}
.home-header::after {
  content: '';
  position: absolute;
  width: 110px; height: 110px;
  background: rgba(94,194,242,0.18);
  border-radius: 50%;
  bottom: -30px; left: 18px;
}
.home-greeting { font-size: 14px; opacity: 0.85; margin-bottom: 4px; font-weight: 500; }
.home-name { font-size: 25px; font-weight: 900; margin-bottom: 14px; letter-spacing: 0.2px; }

.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.quick-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--gray-100);
  border: none;
  border-radius: 16px;
  padding: 13px 14px;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  transition: filter 0.15s var(--ease), transform 0.15s var(--ease);
}
.quick-btn:active { filter: brightness(1.06); transform: scale(0.97); }
.quick-btn-icon { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.quick-btn-icon svg { width: 22px; height: 22px; }
.quick-btn-label { font-size: 13px; font-weight: 700; line-height: 1.3; color: var(--gray-700); }

.quick-btn.c-white { background: #fff; box-shadow: var(--shadow); }
.quick-btn.c-white .quick-btn-icon { color: var(--primary-dark); }
.quick-btn.c-white .quick-btn-label { color: var(--gray-700); }
.quick-btn.c-white:active { filter: brightness(0.97); }

/* ── FOOD LIST ── */
.day-item {
  display: flex;
  align-items: center;
  padding: 15px 16px;
  background: #fff;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  cursor: pointer;
  gap: 12px;
  border: 1.5px solid rgba(20,184,166,0.06);
  transition: all 0.2s var(--ease);
}
.day-item:active {
  opacity: 0.85;
  transform: scale(0.98);
}
.day-item:hover {
  border-color: rgba(20,184,166,0.25);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.day-item-date { font-weight: 700; font-size: 16px; flex: 1; }
.day-item-arrow { color: var(--primary); font-size: 16px; }
.week-header {
  font-size: 12px;
  font-weight: 800;
  color: var(--primary);
  padding: 12px 4px 6px;
  letter-spacing: 0.6px;
  opacity: 0.75;
}

/* ── FOOD ENTRY ── */
.back-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  font-family: inherit;
  font-size: 15px;
  color: var(--primary);
  cursor: pointer;
  padding: 0;
  margin-bottom: 16px;
  font-weight: 700;
  transition: opacity 0.15s;
}
.back-btn:active { opacity: 0.7; }
.meal-section { margin-bottom: 20px; }
.meal-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--gray-700);
  margin-bottom: 9px;
  padding-bottom: 7px;
  border-bottom: 2px solid var(--primary-light);
}
.meal-textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px 14px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  background: var(--gray-100);
  transition: background 0.2s var(--ease), box-shadow 0.2s var(--ease);
  min-height: 76px;
}
.meal-textarea:focus {
  background: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(20,184,166,0.18);
}
.meal-textarea::placeholder { color: var(--gray-400); }
.life-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.life-field label { display: block; font-size: 12px; font-weight: 700; color: var(--gray-500); margin-bottom: 5px; }
.life-field input, .life-field textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 10px 12px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  background: var(--gray-100);
  outline: none;
  transition: background 0.2s var(--ease), box-shadow 0.2s var(--ease);
  -webkit-text-fill-color: var(--gray-800);
  -webkit-appearance: none;
  appearance: none;
}
.life-field input:focus, .life-field textarea:focus {
  background: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(20,184,166,0.18);
}
.life-field input::placeholder, .life-field textarea::placeholder {
  color: var(--gray-400);
  -webkit-text-fill-color: var(--gray-400);
}
.life-field.full { grid-column: 1 / -1; }
.life-field textarea { resize: none; min-height: 72px; }
.save-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
  box-shadow: 0 8px 22px rgba(15,156,143,0.32);
}
.save-btn:active {
  transform: scale(0.97);
  box-shadow: 0 3px 10px rgba(15,156,143,0.2);
}
.notify-btn {
  width: 100%;
  padding: 15px;
  background: var(--primary-light);
  color: var(--primary-dark);
  border: 2px solid var(--primary);
  border-radius: 14px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  margin-top: 10px;
  margin-bottom: 16px;
}
.notify-btn:active, .notify-btn.sent {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border-color: var(--primary-dark);
  box-shadow: 0 8px 22px rgba(15,156,143,0.32);
}
.rd-box {
  background: linear-gradient(135deg, var(--sky-light), var(--primary-light));
  border-left: 3px solid var(--primary);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-top: 16px;
}
.rd-box-title { font-size: 12px; font-weight: 700; color: var(--primary-dark); margin-bottom: 6px; }

/* ── BODY DATA ── */
.body-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.body-table th {
  background: linear-gradient(135deg, var(--primary-light), #fff);
  padding: 11px 4px;
  text-align: center;
  font-size: 11px;
  font-weight: 800;
  color: var(--primary-dark);
  border: 1px solid rgba(20,184,166,0.14);
}
.body-table td { padding: 9px 4px; border: 1px solid rgba(20,184,166,0.1); text-align: center; }
.body-table td input {
  width: 100%;
  border: none;
  background: transparent;
  text-align: center;
  font-size: 14px;
  font-family: inherit;
  font-weight: 600;
  outline: none;
  padding: 0;
}
.body-table tr.current-week { background: var(--primary-light); }
.progress-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--gray-100);
  cursor: pointer;
  transition: opacity 0.15s;
}
.progress-item:last-child { border-bottom: none; }
.progress-item:active { opacity: 0.7; }
.progress-week {
  width: 38px; height: 38px;
  border-radius: 12px;
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 800;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s var(--ease);
}
.progress-week.done {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 4px 12px rgba(15,156,143,0.35);
}

/* ── GOALS ── */
.goal-week-tab {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
  padding-bottom: 4px;

// Build course dates from start to end (inclusive), every day

// ── 日期代號：2026 年（含）以前沿用「月/日」，2027 起加上年份 ──
// 舊資料都是「月/日」格式；若不加年份，2027/4/15 會跟 2026/4/15 用到同一筆紀錄
function dayId(dt) {
  const y = dt.getFullYear(), m = dt.getMonth() + 1, d = dt.getDate();
  return y <= 2026 ? `${m}/${d}` : `${y}/${m}/${d}`;
}
function dayIdToDate(id) {
  const p = String(id).split('/').map(Number);
  return p.length === 3 ? new Date(p[0], p[1] - 1, p[2]) : new Date(2026, p[0] - 1, p[1]);
}

function buildCourseDates(startStr, endStr) {
  const parseDate = str => {
    if (!str) return null;
    const p = str.replace(/-/g,'/').split('/');
    if (p.length === 3) return new Date(+p[0], +p[1]-1, +p[2]);
    if (p.length === 2) return new Date(2026, +p[0]-1, +p[1]);
    return null;
  };
  const base = parseDate(startStr) || new Date(2026, 4, 25);
  const end  = parseDate(endStr);
  if (isNaN(base.getTime())) return [];
  const dates = [];
  COURSE_DATE_OBJ = {};
  for (let i = 0; i < 366; i++) {
    const d = new Date(base); d.setDate(base.getDate() + i);
    if (end && d > end) break;
    if (!end && i >= 29) break;
    const key = dayId(d);
    dates.push(key);
    COURSE_DATE_OBJ[key] = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  return dates;
}

// 「月/日」對應的真實日期（含年份），跨年課程才不會把 12 月誤判成明年
let COURSE_DATE_OBJ = {};
function courseDate(dayStr, h = 0, min = 0) {
  const base = COURSE_DATE_OBJ[dayStr];
  if (base) return new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, min);
  const dt = dayIdToDate(dayStr);
  return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate(), h, min);
}

// COURSE_DATES rebuilt on login from currentUser.start + end
let COURSE_DATES = buildCourseDates('2026/05/25', '2026/06/22');

// Group dates into weeks (7 days each)
function buildWeekGroups(dates) {
  const groups = [];
  for (let w = 0; w * 7 < dates.length; w++) {
    const chunk = dates.slice(w*7, (w+1)*7);
    if (!chunk.length) break;
    groups.push({ label: `W${w+1} ${chunk[0]}–${chunk[chunk.length-1]}`, dates: chunk });
  }
  return groups;
}

}

async function findUser(id, pw) {
  // 1. 靜態測試帳號
  if (USERS[id] && USERS[id].password === pw) return { ...USERS[id], id };
  // 2. localStorage 快取（最快，已有資料就不用等 Supabase）
  try {
    const dyn = JSON.parse(localStorage.getItem('cd_dynuser_' + id));
    if (dyn && dyn.password === pw) return { ...dyn, id };
  } catch(e) {}
  // 3. 查 Supabase（第一次登入或快取沒有時）
  try {
    const res = await Promise.race([
      fetch(`${SB_URL}/rest/v1/cd?key=eq.dynuser_${encodeURIComponent(id)}&select=value`, { headers: SB_HDRS }),
      new Promise((_, r) => setTimeout(() => r(new Error('t')), 10000))
    ]);
    if (res.ok) {
      const rows = await res.json();
      if (rows[0]?.value?.password === pw) {
        // 寫入 localStorage 供下次快速登入
        try { localStorage.setItem('cd_dynuser_' + id, JSON.stringify(rows[0].value)); } catch(e) {}
        return { ...rows[0].value, id };
      }
    }
  } catch(e) {}
  return null;
}

async function doLogin() {
  const id = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value;
  const keep = document.getElementById('keep-login').checked;
  const loginBtn = document.querySelector('.btn-primary');
  if (loginBtn) { loginBtn.textContent = '登入中...'; loginBtn.disabled = true; }
  const u = await findUser(id, pw);
  if (loginBtn) { loginBtn.textContent = '登入'; loginBtn.disabled = false; }
  if (u) {
    currentUser = u;
    document.getElementById('login-error').style.display = 'none';
    // 永遠維持登入（除非使用者主動登出）
    localStorage.setItem('cd_autologin', JSON.stringify({ id, pw }));
    // 立即啟動 App，背景同步（不讓使用者等待）
    preloadLocalCache();
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'none';
    launchApp();
    // 背景同步 Supabase，完成後靜默更新畫面
    setTimeout(async () => {
      try {
        await warmCache(id);
        // 靜默刷新當前頁
        if (document.getElementById('main-content')) renderPage();
        updateInboxBadge();
      } catch(e) {}
    }, 400);
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

function launchApp() {
  const startDate = currentUser.start || '2026/05/25';
  const endDate   = currentUser.end   || null;
  COURSE_DATES.length = 0;
  buildCourseDates(startDate, endDate).forEach(d => COURSE_DATES.push(d));

  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('topbar-name').textContent = currentUser.name + ' 學員';

  startRealtimeSync(currentUser.id);

  setInterval(async () => {
    try {
      const prevData = currentFoodDay ? JSON.stringify(gs(`food_${currentUser.id}_${currentFoodDay}`)) : null;
      await warmCache(currentUser.id);
      updateInboxBadge();
if (currentFoodDay) {
        const newData = JSON.stringify(gs(`food_${currentUser.id}_${currentFoodDay}`));
        if (newData !== prevData) {
          document.getElementById('main-content').innerHTML = renderFoodEntry(currentFoodDay);
        }
      }
    } catch(e) {}
  }, 15000);

  window.addEventListener('online', async () => {
  showToast('🌐 網路已恢復，同步離線資料中…');
  await flushPendingWrites();
});
setTimeout(flushPendingWrites, 2000);
showPage('home');
  setTimeout(updateInboxBadge, 500);
}

  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pw').type = 'password';
  document.getElementById('pw-toggle').textContent = '顯示';
  currentUser = null;
  document.getElementById('login-id').value = '';
  document.getElementById('login-pw').value = '';
  document.getElementById('keep-login').checked = false;
  // Clear cache on logout
  Object.keys(_cache).forEach(k => delete _cache[k]);
  // 清除增量同步時間戳
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith('cd_last_sync_')) localStorage.removeItem(k);
    }
  } catch(e) {}
}

// Auto-login check on page load
(function checkAutoLogin() {
  setTimeout(async () => {
    try {
      const saved = JSON.parse(localStorage.getItem('cd_autologin'));
      if (saved && saved.id && saved.pw) {
        const u = await findUser(saved.id, saved.pw);
        if (u) {
          currentUser = u;
          // 立即啟動，背景同步
          preloadLocalCache();
          document.getElementById('loading-screen').style.display = 'none';
          launchApp();
          setTimeout(async () => {
            try {
              await warmCache(saved.id);
              if (document.getElementById('main-content')) renderPage();
              updateInboxBadge();
            } catch(e) {}
          }, 400);
          return;
        }
      }
    } catch(e) {}
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  }, 800);
})();

// ══════════ NAV ══════════
function showPage(page) {
  currentPage = page;
  currentFoodDay = null;
  currentProgressWeek = null;
  // 進入「目標」頁時，自動偵測今天日期並跳到對應週次
  if (page === 'goals') {
    const wGroupsNow = buildWeekGroups(COURSE_DATES);
    const todayNow = new Date();
    const todayStrNow = dayId(todayNow);
    const idxNow = wGroupsNow.findIndex(wg => wg.dates.includes(todayStrNow));
    if (idxNow >= 0) currentGoalWeek = idxNow + 1;
  }
  // 隱藏飲食固定按鈕
  const bar = document.getElementById('food-action-bar');
  if (bar) bar.style.display = 'none';
  ['home','food','body','goals','menu','materials','inbox'].forEach(p => {
    const el = document.getElementById('nav-' + p);
    if (el) el.classList.toggle('active', p === page);
  });
  // Show loading briefly while rendering (prevents blank flash)
  const el = document.getElementById('main-content');
  el.innerHTML = `<div class="inline-loading">
    <div class="loading-spinner"></div>
    <div style="font-size:13px;color:var(--primary);font-weight:600">載入中…</div>
  </div>`;
  // Use requestAnimationFrame to let browser paint loading first, then render
  requestAnimationFrame(() => requestAnimationFrame(() => {
    renderPage();
    if (page === 'goals') {
      const activeTab = document.querySelector('.week-tab-btn.active');
      if (activeTab) activeTab.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
    }
  }));
}

// ══════════ TOAST ══════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ══════════ RENDER ══════════
function renderPage() {
  const el = document.getElementById('main-content');
  if (currentFoodDay) { el.innerHTML = renderFoodEntry(currentFoodDay); return; }
  if (currentProgressWeek !== null && currentPage === 'body') { el.innerHTML = renderProgressDetail(currentProgressWeek); return; }
  const map = { home: renderHome, food: renderFoodList, body: renderBody, goals: renderGoals, menu: renderMenu, materials: renderMaterials, inbox: renderInbox };
  el.innerHTML = (map[currentPage] || renderHome)();
}

// ── HOME ──
async function syncClientData() {
  const btn = document.querySelector('[onclick="syncClientData()"]');
  if (btn) { btn.style.opacity = '0.5'; btn.innerHTML = ic('refresh',13) + ' 同步中…'; }
  try {
    const userId = currentUser.id;
    // 手動同步：清除增量時間戳，強制完整同步
    localStorage.removeItem('cd_last_sync_' + userId);
    await warmCache(userId);
    if (btn) { btn.style.opacity = ''; btn.innerHTML = ic('refresh',13) + ' 同步資料'; }
    showToast('✅ 資料已同步！');
    // 重新渲染當前頁面，讓營養師回覆立即顯示
    if (currentFoodDay) {
      document.getElementById('main-content').innerHTML = renderFoodEntry(currentFoodDay);
    } else {
      renderPage();
    }
    updateInboxBadge();
  } catch(e) {
    if (btn) { btn.style.opacity = ''; btn.innerHTML = ic('refresh',13) + ' 同步資料'; }
    console.error('Sync error:', e);
    showToast('⚠️ 同步失敗：' + (e.message || '請檢查網路'));
  }
}

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}_${d.getMonth()+1}_${d.getDate()}`;
}

function getDailyGoals(userId, week) {
  const today = getTodayKey();

// ── FOOD LIST ──
// ── 課程涵蓋的月份清單（用於日曆分頁）──
function getCourseMonths() {
  const seen = new Set(), months = [];
  COURSE_DATES.forEach(d => {
    const dt = courseDate(d);
    const id = dt.getFullYear() * 12 + dt.getMonth();
    if (!seen.has(id)) { seen.add(id); months.push({ y: dt.getFullYear(), m: dt.getMonth() + 1 }); }
  });
  return months;
}

function changeCalMonth(delta) {
  const months = getCourseMonths();
  const cur = calMonthIdx === null ? 0 : calMonthIdx;
  calMonthIdx = Math.max(0, Math.min(months.length - 1, cur + delta));
  document.getElementById('main-content').innerHTML = renderFoodList();
}

function renderCalendarGrid(y, m) {
  const firstDay = new Date(y, m - 1, 1);
  const startWeekday = (firstDay.getDay() + 6) % 7; // 週一起始
  const daysInMonth = new Date(y, m, 0).getDate();
  const weekdayLabels = ['一','二','三','四','五','六','日'];
  const today = new Date();
  const todayY = today.getFullYear(), todayM = today.getMonth() + 1, todayD = today.getDate();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const dayCellHtml = (d) => {
    if (d === null) return `<div style="flex:1;aspect-ratio:1"></div>`;
    const dayStr = dayId(new Date(y, m - 1, d));
    const inCourse = COURSE_DATES.includes(dayStr) && courseDate(dayStr).getFullYear() === y;
    const isToday = y === todayY && m === todayM && d === todayD;
    const saved = inCourse ? gs(`food_${currentUser.id}_${dayStr}`) : null;
    const hasRecord = !!(saved && (saved.notified || saved.hasData));
    let color = 'var(--gray-300)', weight = '400';
    if (inCourse) { color = hasRecord ? 'var(--primary)' : 'var(--gray-700)'; weight = hasRecord ? '800' : '600'; }
    const circleStyle = isToday
      ? `background:var(--primary);color:#fff;font-weight:800`
      : `background:transparent;color:${color};font-weight:${weight}`;
    return `<div style="flex:1;aspect-ratio:1;display:flex;align-items:center;justify-content:center">
      <div ${inCourse ? `onclick="openFoodDay('${dayStr}')"` : ''} style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;${circleStyle};${inCourse ? 'cursor:pointer' : ''}">${d}</div>
    </div>`;
  };

  const rows = [];
  for (let i = 0; i < cells.length; i += 7) rows.push(cells.slice(i, i + 7));
  const rowsHtml = rows.map(row => `<div style="display:flex">${row.map(dayCellHtml).join('')}</div>`).join('');

  const months = getCourseMonths();
  const idx = calMonthIdx === null ? 0 : calMonthIdx;
  const hasPrev = idx > 0, hasNext = idx < months.length - 1;

  return `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <button onclick="changeCalMonth(-1)" ${hasPrev ? '' : 'disabled'} style="width:30px;height:30px;border-radius:50%;border:none;background:${hasPrev ? 'var(--gray-100)' : 'transparent'};color:${hasPrev ? 'var(--gray-600)' : 'var(--gray-200)'};font-size:16px;cursor:${hasPrev ? 'pointer' : 'default'};font-family:inherit">‹</button>
      <div style="font-size:16px;font-weight:800;color:var(--gray-900)">${y} 年 ${m} 月</div>
      <button onclick="changeCalMonth(1)" ${hasNext ? '' : 'disabled'} style="width:30px;height:30px;border-radius:50%;border:none;background:${hasNext ? 'var(--gray-100)' : 'transparent'};color:${hasNext ? 'var(--gray-600)' : 'var(--gray-200)'};font-size:16px;cursor:${hasNext ? 'pointer' : 'default'};font-family:inherit">›</button>
    </div>
    <div style="display:flex;margin-bottom:6px">${weekdayLabels.map(w => `<div style="flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--gray-400)">${w}</div>`).join('')}</div>
    ${rowsHtml}
    <div style="display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--gray-100);font-size:11px;color:var(--gray-500)">
      <span style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:50%;background:var(--primary)"></span>已紀錄</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:50%;background:var(--gray-400)"></span>尚未紀錄</span>
    </div>
  </div>`;
}

        <div style="font-size:18px;width:28px;text-align:center;flex-shrink:0">${icon}</div>
        <div class="day-item-date" style="color:var(--primary-dark)">
          ${todayStr} <span style="font-size:12px;font-weight:600;color:var(--primary)">(今天)</span>
        </div>
        <div class="day-item-arrow">›</div>
      </div>`;
  }

  const months = getCourseMonths();
  if (calMonthIdx === null || calMonthIdx < 0 || calMonthIdx >= months.length) {
    const todayY = today.getFullYear(), todayM = today.getMonth() + 1;
    let idx = months.findIndex(cm => cm.y === todayY && cm.m === todayM);
    if (idx < 0) {
      const first = months[0], last = months[months.length - 1];
      idx = (todayY < first.y || (todayY === first.y && todayM < first.m)) ? 0 : months.length - 1;
    }
    calMonthIdx = idx;
  }
  const { y: calY, m: calM } = months[calMonthIdx];

  return '<div class="page-title">飲食紀錄</div>' + todayHTML + renderCalendarGrid(calY, calM);
}

function openFoodDay(day) {
  currentFoodDay = day;
  const key = `food_${currentUser.id}_${day}`;
  const existing = gs(key);
  if (existing) {
    existing.stuReadAt = new Date().toISOString();
    ss(key, existing);
  }
  document.getElementById('main-content').innerHTML = renderFoodEntry(day);
  // 顯示固定按鈕
  const bar = document.getElementById('food-action-bar');
  if (bar) {
    bar.style.display = 'flex';
    const food = gs(key) || {};
    // 更新通知按鈕狀態
    const notifyBtn = document.getElementById('notify-btn-fixed');
    if (notifyBtn) {
      if (food.notified) {
        notifyBtn.classList.add('sent');
        notifyBtn.innerHTML = ic('check',14) + ' 已通知營養師';
        notifyBtn.disabled = false;
      } else {
        notifyBtn.classList.remove('sent');
        notifyBtn.innerHTML = ic('bell',14) + ' 完成紀錄後按我通知營養師～';
        notifyBtn.disabled = false;
      }
    }
    // 重置儲存按鈕
    const saveBtn = document.getElementById('save-btn-fixed');
    if (saveBtn) {
      saveBtn.style.background = '#fff';
      saveBtn.style.color = 'var(--primary)';
      saveBtn.style.border = 'none';
      saveBtn.innerHTML = ic('save',14) + ' 儲存紀錄';
      saveBtn.disabled = false;
    }
  }
  scrollToCurrentMeal();
}

// ── 依現在時間自動捲動到對應餐次 ──
function scrollToCurrentMeal() {
  const hour = new Date().getHours();
  let mealKey;
  if (hour < 9)       mealKey = 'breakfast';
  else if (hour < 11) mealKey = 'snack1';
  else if (hour < 14) mealKey = 'lunch';
  else if (hour < 17) mealKey = 'snack2';
  else if (hour < 20) mealKey = 'dinner';
  else                mealKey = 'latenight';

  setTimeout(() => {
    const ta = document.getElementById(`meal-${mealKey}`);
    if (ta) {
      ta.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }, 100);
}

function showPointTip(evt, text) {
  evt.stopPropagation();
  let tip = document.getElementById('chart-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'chart-tip';
    tip.style.cssText = 'position:fixed;z-index:9999;background:var(--primary-dark);color:#fff;padding:6px 11px;border-radius:9px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,0.22);opacity:0;transition:opacity 0.12s ease;';
    document.body.appendChild(tip);
  }
  const rect = evt.target.getBoundingClientRect();
  tip.textContent = text;
  tip.style.left = (rect.left + rect.width / 2) + 'px';
  tip.style.top = rect.top + 'px';
  tip.style.transform = 'translate(-50%,calc(-100% - 8px))';
  tip.style.opacity = '1';
  clearTimeout(tip._hideTimer);
  tip._hideTimer = setTimeout(() => { tip.style.opacity = '0'; }, 2200);
}

function sparkline(points, unit) {
  const W = 300, H = 106, padL = 8, padR = 8, padT = 10, padB = 16;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const validVals = points.filter(p => p.v !== null && p.v !== undefined && p.v !== '').map(p => parseFloat(p.v));
  if (!validVals.length) return `<div style="text-align:center;color:var(--gray-300);font-size:12px;padding:16px 0">尚無資料</div>`;
  const min = Math.min(...validVals), max = Math.max(...validVals);
  const range = (max - min) || 1;
  const yMin = min - range * 0.25, yMax = max + range * 0.25;
  const n = points.length;
  const stepX = n > 1 ? innerW / (n - 1) : 0;
  const coords = points.map((p, i) => {
    const has = p.v !== null && p.v !== undefined && p.v !== '';
    const x = padL + i * stepX;
    const y = has ? padT + innerH - ((parseFloat(p.v) - yMin) / (yMax - yMin)) * innerH : null;
    return { x, y, label: p.x, v: p.v, has };
  });
  const validCoords = coords.filter(c => c.has);
  const pathD = validCoords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const dots = validCoords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4.5" fill="var(--primary)" stroke="#fff" stroke-width="1.5" style="cursor:pointer" onclick="showPointTip(event,'${c.label}：${c.v}${unit}')"></circle>`).join('');
  const monthLabels = coords.map((c, i) => {
    const month = c.label.split('/')[0];
    const prevMonth = i > 0 ? coords[i-1].label.split('/')[0] : null;
    if (month === prevMonth) return '';
    return `<text x="${c.x.toFixed(1)}" y="${H - 4}" font-size="9" fill="#94a3b8" text-anchor="middle">${month}月</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">
    <path d="${pathD}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
    ${dots}
    ${monthLabels}
  </svg>`;
}

function renderBody() {

    return savedProg[i] || defaultProg[i];
  });

  const w1 = prog[0] ? prog[0].weight : null;
  const latest = prog.slice().reverse().find(function(p) { return p.weight; });

  const today = new Date();

            ${hasEx ? ic('run',16) : '—'}
          </div>
          ${hasEx ? `<div style="font-size:11px;font-weight:700;color:var(--primary);margin-top:4px;line-height:1.3;word-break:break-word;text-align:center">${f.exType}</div>
          <div style="font-size:11px;font-weight:700;color:var(--gray-500);margin-top:1px;text-align:center">${f.exMin ? f.exMin+'分' : ''}</div>` : ''}
        </div>`;
      }).join('');
      const exCount = wg.dates.filter(d => {
        const f = gs(`food_${currentUser.id}_${d}`);
        return f && f.exType && f.exType.trim();
      }).length;
      return `<div class="card" style="margin-top:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div class="card-title" style="margin:0">${ic('run')} W${wi+1} 運動紀錄</div>
          <span style="font-size:13px;font-weight:700;color:${exCount >= 3 ? 'var(--primary)' : 'var(--gray-400)'}">本週 ${exCount} 天</span>

    }).join('');
  })()
}

function updateProg(el) {
  const i = parseInt(el.dataset.pi);
  const f = el.dataset.pf;
  const wGroups = buildWeekGroups(COURSE_DATES);
  const totalWeeks = wGroups.length || 1;
  const savedProg = gs(`progress_${currentUser.id}`) || [];
  const prog = Array.from({ length: totalWeeks }, (_, j) =>
    savedProg[j] || { week: `W${j+1}`, weight: null, fat: null, waist: null, muscle: null }
  ); // updateProg inline default OK
  prog[i][f] = el.value ? parseFloat(el.value) : null;
  prog[i].recordedAt = new Date().toISOString();
  ss(`progress_${currentUser.id}`, prog);
}

function saveProgress() {
  // 儲存數值後重置通知按鈕（讓學員重新點通知）
  const notifKey = `body_notif_${currentUser.id}`;
  const existing = gs(notifKey) || {};
  existing.notified = false; // 重置通知狀態
  ss(notifKey, existing);

  // 更新按鈕外觀
  const btn = document.getElementById('body-notify-btn');
  if (btn) {
    btn.classList.remove('sent');
    btn.innerHTML = ic('bell',14) + ' 完成後通知營養師';
    btn.onclick = notifyBody;
  }
  showToast('✅ 數值已儲存！');
}
function notifyBody() {
  const prog = gs(`progress_${currentUser.id}`) || [];
  const notifKey = `body_notif_${currentUser.id}`;
  ss(notifKey, {
    notified: true,
    notifiedAt: new Date().toISOString(),
    name: currentUser.name,
    rdId: currentUser.rd || null
  });
  // 按鈕反白確認（同飲食紀錄的通知按鈕）
  const btn = document.getElementById('body-notify-btn');
  if (btn) {
    btn.classList.add('sent');
    btn.innerHTML = ic('check',14) + ' 已通知營養師';
    btn.onclick = null;
  }
  showToast('🎉 已通知營養師！等待確認中...');
  // 推播通知給營養師
}

// ── GOALS (每日打勾，每天凌晨歸零) ──
function parseCpvfdoBadges(str) {
  if (!str) return '';
  const cats = ['C','P','V','F','D','O'];
  const labels = {C:'全穀',P:'豆魚蛋肉',V:'蔬菜',F:'水果',D:'乳品',O:'油脂'};
  const bg = {C:'#fef3c7',P:'#ffe4e6',V:'#dcfce7',F:'#fce7f3',D:'#e0f2fe',O:'#f5f3ff'};
  const tc = {C:'#92400e',P:'#9f1239',V:'#166534',F:'#9d174d',D:'#0369a1',O:'#5b21b6'};
  return str.split('｜').map(s => {
    const l = s.trim().charAt(0);
    if (!cats.includes(l)) return '';
    return '<span style="background:'+bg[l]+';color:'+tc[l]+';font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px">'+l+' '+labels[l]+': '+s.trim().slice(1).trim()+'</span>';
  }).filter(Boolean).join('');
}

function renderHomeWplanCard(week, curProg) {
  const plan = gs('wplan_'+currentUser.id+'_'+week) || {};
  if (!plan.calories && !plan.total) return '';
  const calStr = plan.calories || '';
  const totalStr = plan.total || '';
  return '<div class="card card-tap" style="padding:12px 16px" onclick="showPage(&quot;goals&quot;)">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">' +
      '<div style="font-size:11px;font-weight:700;color:var(--gray-500)">' + ic('bowl',12) + ' 本週飲食目標設定</div>' +
      '<div style="font-size:11px;color:var(--primary)">查看詳情 ›</div>' +
    '</div>' +
    (calStr ? '<div style="font-size:16px;font-weight:700;color:var(--primary);margin-bottom:4px">' + calStr + '</div>' : '') +
    (totalStr ? '<div style="font-size:12px;color:var(--gray-600);line-height:1.6">' + totalStr + '</div>' : '') +
    '</div>';
}

function openGoalAchievement() {
  // 顯示每週小目標達成率頁面（非本週計畫）
  // 自動偵測今天日期並跳到對應週次，跟「本週熱量目標」一致
  const wGroupsNow = buildWeekGroups(COURSE_DATES);
  const todayNow = new Date();
  const todayStrNow = dayId(todayNow);
  const idxNow = wGroupsNow.findIndex(wg => wg.dates.includes(todayStrNow));
  if (idxNow >= 0) currentGoalWeek = idxNow + 1;
  const el = document.getElementById('main-content');
  if (el) el.innerHTML = renderGoalAchievement();
  const activeTab = document.querySelector('.week-tab-btn.active');
  if (activeTab) activeTab.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
}

function renderGoalAchievement() {
  const wGroups = buildWeekGroups(COURSE_DATES);
  const totalWeeks = wGroups.length || 1;
  if (currentGoalWeek > totalWeeks) currentGoalWeek = 1;

  const todayForTabs = new Date();
  const todayStrForTabs = dayId(todayForTabs);
  const actualCurWeekIdx = wGroups.findIndex(wg => wg.dates.includes(todayStrForTabs));
  const actualCurWeek = actualCurWeekIdx >= 0 ? actualCurWeekIdx + 1 : null;

  const tabs = Array.from({length: totalWeeks}, (_, i) => i+1).map(w =>
    `<button class="week-tab-btn ${w === currentGoalWeek ? 'active' : ''}" onclick="currentGoalWeek=${w};document.getElementById('main-content').innerHTML=renderGoalAchievement()">${w === actualCurWeek ? `本週（第 ${w} 週）` : `第 ${w} 週`}</button>`
  ).join('');

  const goals = gs(`goals_${currentUser.id}_${currentGoalWeek}`) || [];
  const today = getTodayKey();
  const dailyDone = gs(`daily_goals_${currentUser.id}_${currentGoalWeek}_${today}`) || [];
  const doneToday = goals.filter((_, i) => dailyDone[i]).length;

  const goalItems = goals.length ? goals.map((g, i) => `
    <div class="goal-item" style="align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray-100)">
      <div class="goal-check ${dailyDone[i] ? 'checked' : ''}" onclick="toggleDailyGoal(${i})" style="flex-shrink:0;margin-top:2px"></div>
      <div style="flex:1;min-width:0">
        <div class="goal-text ${dailyDone[i] ? 'done' : ''}" style="font-size:14px;word-break:break-word">${g.text}</div>
        <div style="font-size:11px;color:var(--gray-400);margin-top:2px">每天做到就打勾，每天凌晨自動歸零</div>
      </div>
    </div>`).join('') : `<div style="text-align:center;padding:24px 0;color:var(--gray-400);font-size:14px">本週目標尚未設定<br>請等待營養師更新</div>`;

  const wg = wGroups[currentGoalWeek - 1];
  const weekDates = wg ? wg.dates : [];
  const achievedDays = weekDates.filter(dateStr => {
    const dt = courseDate(dateStr);
    if (dt > new Date()) return false;
    const dk = `${dt.getFullYear()}_${dt.getMonth()+1}_${dt.getDate()}`;
    const dd = gs(`daily_goals_${currentUser.id}_${currentGoalWeek}_${dk}`) || [];
    return goals.length > 0 && goals.every((_, i) => dd[i]);
  }).length;
  const weekPct = Math.round(achievedDays / 7 * 100);

  const dayRows = weekDates.map(dateStr => {
    const dt = courseDate(dateStr);
    const dayKey = `${dt.getFullYear()}_${dt.getMonth()+1}_${dt.getDate()}`;
    const dayDone = gs(`daily_goals_${currentUser.id}_${currentGoalWeek}_${dayKey}`) || [];
    const dayCount = goals.filter((_, i) => dayDone[i]).length;
    const allDone = goals.length > 0 && dayCount === goals.length;
    const isToday = dayKey === today;
    const isFuture = dt > new Date();
    return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--gray-100)">
      <div style="color:${allDone ? 'var(--green)' : 'var(--gray-300)'}">${allDone ? ic('check',18) : isFuture ? '⬜' : goals.length === 0 ? '—' : '○'}</div>
      <div style="flex:1;font-size:13px;font-weight:${isToday ? '700' : '400'};color:${isToday ? 'var(--primary-dark)' : 'var(--gray-600)'}">
        週${['日','一','二','三','四','五','六'][dt.getDay()]} ${dateStr}${isToday ? '（今天）' : ''}
      </div>
      <div style="font-size:12px;color:${allDone ? 'var(--primary)' : 'var(--gray-400)'}">
        ${isFuture ? '—' : goals.length ? `${dayCount}/${goals.length}` : '—'}
      </div>
    </div>`;
  });

  return `
  <button class="back-btn" onclick="document.getElementById('main-content').innerHTML=renderHome()">‹ 返回首頁</button>
  <div class="page-title">每週小目標達成率</div>
  <div class="goal-week-tab">${tabs}</div>

  <div class="card">
    <div class="card-title">${ic('target')} 第 ${currentGoalWeek} 週目標（今日 ${doneToday}/${goals.length || '?'} 項完成）</div>
    ${goalItems}
    ${goals.length ? `<div style="margin-top:8px;font-size:12px;color:var(--gray-400)">${ic('info',13)} 每天做到就打勾，每天凌晨 00:00 自動歸零！</div>` : ''}
  </div>

  <div class="card">
    <div class="card-title">${ic('chart')} 本週 7 天達成率
      <span style="font-size:13px;font-weight:400;color:var(--gray-500);margin-left:8px">${achievedDays}/7 天（${weekPct}%）</span>
    </div>
    <div style="background:var(--gray-200);height:8px;border-radius:4px;overflow:hidden;margin-bottom:14px">
      <div style="background:var(--primary);height:100%;width:${weekPct}%;border-radius:4px;transition:width 0.4s"></div>
    </div>
    ${dayRows.join('')}
    <div style="margin-top:8px;font-size:11px;color:var(--gray-400);display:flex;align-items:center;gap:4px"><span style="color:var(--green)">${ic('check',13)}</span> = 當天所有目標全部完成｜○ = 部分完成或尚未完成</div>
  </div>`;
}

function renderGoals() {
  const wGroups = buildWeekGroups(COURSE_DATES);
  const totalWeeks = wGroups.length || 1;
  if (currentGoalWeek > totalWeeks) currentGoalWeek = 1;

  const todayForTabs = new Date();
  const todayStrForTabs = dayId(todayForTabs);
  const actualCurWeekIdx = wGroups.findIndex(wg => wg.dates.includes(todayStrForTabs));
  const actualCurWeek = actualCurWeekIdx >= 0 ? actualCurWeekIdx + 1 : null;

  const tabs = Array.from({length: totalWeeks}, (_, i) => i+1).map(w =>
    `<button class="week-tab-btn ${w === currentGoalWeek ? 'active' : ''}" onclick="switchGoalWeek(${w})">${w === actualCurWeek ? `本週（第 ${w} 週）` : `第 ${w} 週`}</button>`
  ).join('');

  const plan  = gs(`wplan_${currentUser.id}_${currentGoalWeek}`) || {};
  const goals = gs(`goals_${currentUser.id}_${currentGoalWeek}`) || [];
  const prog  = gs(`progress_${currentUser.id}`) || getDefaultProgress(totalWeeks);
  const curProg = prog[currentGoalWeek-1] || {};
  const today = getTodayKey();
  const dailyDone = gs(`daily_goals_${currentUser.id}_${currentGoalWeek}_${today}`) || [];
  const doneToday = goals.filter((_, i) => dailyDone[i]).length;

  // CPVFDO badge parser
  function parseCpvfdo(str) {
    if (!str) return '';
    const cats = ['C','P','V','F','D','O'];
    const labels = {C:'全穀',P:'豆魚蛋肉',V:'蔬菜',F:'水果',D:'乳品',O:'油脂'};
    const bg = {C:'#fef3c7',P:'#ffe4e6',V:'#dcfce7',F:'#fce7f3',D:'#e0f2fe',O:'#f5f3ff'};
    const tc = {C:'#92400e',P:'#9f1239',V:'#166534',F:'#9d174d',D:'#0369a1',O:'#5b21b6'};
    return str.split('｜').map(s => {
      const l = s.trim().charAt(0);
      if (!cats.includes(l)) return '';
      return `<span style="background:${bg[l]};color:${tc[l]};font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px">${l} ${labels[l]}: ${s.trim().slice(1).trim()}</span>`;
    }).filter(Boolean).join('');
  }

  const hasMeals = plan.breakfast || plan.lunch || plan.dinner || plan.snack;
  const hasPlan = plan.calories || hasMeals || plan.date || plan.session || plan.weight;

  // 7-day goal tracking
  const wg = wGroups[currentGoalWeek-1];
  const weekDates = wg ? wg.dates : [];
  const achievedDays = weekDates.filter(dateStr => {
    const dt = courseDate(dateStr);
    if (dt > new Date()) return false;
    const dk = `${dt.getFullYear()}_${dt.getMonth()+1}_${dt.getDate()}`;
    const dd = gs(`daily_goals_${currentUser.id}_${currentGoalWeek}_${dk}`) || [];
    return goals.length > 0 && goals.every((_, i) => dd[i]);
  }).length;
  const weekPct = Math.round(achievedDays / 7 * 100);

  return `
  <div class="page-title">本週計畫與目標</div>
  <div class="goal-week-tab">${tabs}</div>

  <!-- 本週計畫 -->
  <div class="card">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px">
      <div class="card-title" style="margin:0">${ic('list')} 第 ${currentGoalWeek} 週計畫</div>
      ${curProg.weight ? `<span style="font-size:12px;color:var(--gray-400)">目前體重 ${curProg.weight}kg</span>` : ''}
    </div>
    ${hasPlan ? `
      ${plan.date ? `<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--gray-100)">
        <span style="font-size:13px;font-weight:600;color:var(--gray-500);width:70px;flex-shrink:0">日期</span>
        <span style="font-size:13px;color:var(--gray-700)">${plan.date}</span>
      </div>` : ''}
      ${plan.calories ? `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--gray-100)">
        <span style="font-size:13px;font-weight:600;color:var(--gray-500);width:70px;flex-shrink:0">熱量設定</span>
        <span style="font-size:16px;font-weight:700;color:var(--primary)">${plan.calories}</span>
      </div>` : ''}
      ${plan.weight ? `<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--gray-100)">
        <span style="font-size:13px;font-weight:600;color:var(--gray-500);width:70px;flex-shrink:0">本週體重</span>
        <span style="font-size:13px;color:var(--gray-700)">${curProg.weight ? curProg.weight + ' kg（目標 ' + plan.weight + ' kg）' : plan.weight + ' kg'}</span>
      </div>` : ''}
      ${plan.fat ? `<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--gray-100)">
        <span style="font-size:13px;font-weight:600;color:var(--gray-500);width:70px;flex-shrink:0">本週體脂</span>
        <span style="font-size:13px;color:var(--gray-700)">${curProg.fat ? curProg.fat + ' %（目標 ' + plan.fat + ' %）' : plan.fat + ' %'}</span>
      </div>` : ''}
      ${plan.waist ? `<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--gray-100)">
        <span style="font-size:13px;font-weight:600;color:var(--gray-500);width:70px;flex-shrink:0">目標腰圍</span>
        <span style="font-size:13px;color:var(--gray-700)">${plan.waist} cm</span>
      </div>` : ''}
      ${plan.session ? `<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--gray-100)">
        <span style="font-size:13px;font-weight:600;color:var(--gray-500);width:70px;flex-shrink:0">視訊課程</span>
        <span style="font-size:13px;color:var(--teal);font-weight:600">${ic('calendar',13)} ${plan.session}</span>
      </div>` : ''}
      ${plan.total ? `<div style="background:var(--primary-light);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;font-weight:700;color:var(--primary-dark)">整天合計：${plan.total}</div>` : ''}
      ${hasMeals ? `
