        ${plan.breakfast ? `<div style="padding:6px 0;border-bottom:1px solid var(--gray-100)"><span style="font-size:12px;font-weight:600;color:var(--gray-500);margin-right:6px">早餐</span><span style="display:inline-flex;flex-wrap:wrap;gap:3px">${parseCpvfdo(plan.breakfast)}</span></div>` : ''}
        ${plan.lunch ? `<div style="padding:6px 0;border-bottom:1px solid var(--gray-100)"><span style="font-size:12px;font-weight:600;color:var(--gray-500);margin-right:6px">午餐</span><span style="display:inline-flex;flex-wrap:wrap;gap:3px">${parseCpvfdo(plan.lunch)}</span></div>` : ''}
        ${plan.dinner ? `<div style="padding:6px 0;border-bottom:1px solid var(--gray-100)"><span style="font-size:12px;font-weight:600;color:var(--gray-500);margin-right:6px">晚餐</span><span style="display:inline-flex;flex-wrap:wrap;gap:3px">${parseCpvfdo(plan.dinner)}</span></div>` : ''}
        ${plan.snack ? `<div style="padding:6px 0"><span style="font-size:12px;font-weight:600;color:var(--gray-500);margin-right:6px">點心</span><span style="display:inline-flex;flex-wrap:wrap;gap:3px">${parseCpvfdo(plan.snack)}</span></div>` : ''}
      ` : ''}
    ` : `<div style="text-align:center;padding:20px 0;color:var(--gray-400);font-size:14px">本週計畫尚未設定<br>請等待營養師更新</div>`}
  </div>

  ${plan.exercise ? `<div class="card">
    <div class="card-title">${ic('run')} 本週運動建議</div>
    <div style="font-size:14px;color:var(--gray-600);line-height:1.6">${plan.exercise}</div>
  </div>` : ''}

  ${plan.note ? `<div class="card">
    <div class="card-title">${ic('droplet')} 其他生活小提醒（飲水、睡眠、壓力等）</div>
    <div style="font-size:14px;color:var(--gray-600);line-height:1.8">${plan.note}</div>
  </div>` : ''}`;
}

function toggleDailyGoal(i) {
  const goals = gs(`goals_${currentUser.id}_${currentGoalWeek}`) || [];
  if (!goals[i]) return;
  const today = getTodayKey();
  const key = `daily_goals_${currentUser.id}_${currentGoalWeek}_${today}`;
  const dailyDone = gs(key) || [];
  dailyDone[i] = !dailyDone[i];
  ss(key, dailyDone);
  // 如果是從每週小目標達成率頁面點的，留在那個頁面
  const el = document.getElementById('main-content');
  if (el) {
    const html = el.innerHTML;
    if (html.includes('每週小目標達成率')) {
      el.innerHTML = renderGoalAchievement();
    } else {
      el.innerHTML = renderGoals();
    }
  }
  updateInboxBadge();
}

function toggleGoal(i) { toggleDailyGoal(i); } // backward compat

function switchGoalWeek(w) {
  currentGoalWeek = w;
  document.getElementById('main-content').innerHTML = renderGoals();
}

// ── INBOX ──
// 點擊單一訊息才標記為已讀（不再一進頁面就整批已讀）
function markInboxRead(reversedIdx) {
  const msgs = gs(`inbox_${currentUser.id}`) || [];
  const realIdx = msgs.length - 1 - reversedIdx;
  if (msgs[realIdx] && !msgs[realIdx].read) {
    msgs[realIdx].read = true;
    ss(`inbox_${currentUser.id}`, msgs);
    updateInboxBadge();
  }
}

// 一鍵刪除所有已讀信件
function clearReadInboxMsgs() {
  const msgs = gs(`inbox_${currentUser.id}`) || [];
  const readCount = msgs.filter(m => m.read).length;
  if (readCount === 0) { showToast('目前沒有已讀信件'); return; }
  if (!window.confirm(`確定要刪除 ${readCount} 則已讀信件嗎？此動作無法復原。`)) return;
  ss(`inbox_${currentUser.id}`, msgs.filter(m => !m.read));
  showToast('🗑️ 已刪除已讀信件');
  document.getElementById('main-content').innerHTML = renderInbox();
}

function renderInbox() {
  const msgs = gs(`inbox_${currentUser.id}`) || [];
  const sorted = [...msgs].reverse();
  const unreadCount = msgs.filter(m => !m.read).length;
  const readCount = msgs.length - unreadCount;
  const actionMap = {
    feedback: (m) => `goToFeedbackDay('${m.day || ''}')`,
    weekplan: () => `showPage('goals')`,
    bodytrack: () => `showPage('body')`,
    menu: () => `showPage('menu')`,
    materials: () => `showPage('materials')`,
    general: () => ``
  };
  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div class="page-title" style="margin:0">${ic('mail',22)} 收件夾${unreadCount > 0 ? `<span style="font-size:12px;font-weight:800;color:#fff;background:var(--red);border-radius:20px;padding:2px 9px;margin-left:8px;vertical-align:middle">${unreadCount} 未讀</span>` : ''}</div>
    ${readCount > 0 ? `<button onclick="clearReadInboxMsgs()" style="border:none;background:var(--gray-100);color:var(--gray-600);font-size:12px;font-weight:700;padding:8px 13px;border-radius:20px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;white-space:nowrap">${ic('trash',13)} 清除已讀</button>` : ''}
  </div>
  ${sorted.length === 0 ? `<div class="card"><div style="text-align:center;padding:24px 0;color:var(--gray-400);font-size:14px">尚無通知<br>當營養師有新回饋或更新時，這裡會收到通知！</div></div>` : ''}
  ${sorted.map((m, i) => `
    <div class="card card-tap" style="background:${m.read ? '#fff' : 'var(--primary-light)'}"
      onclick="markInboxRead(${i});${actionMap[m.type || 'general']?.(m) || ''}">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="flex-shrink:0">${m.read ? ICON_MAIL_OPEN : ICON_MAIL_CLOSED}</div>
        <div style="flex:1">
          <div style="font-weight:${m.read ? '600' : '800'};font-size:14px;color:${m.read ? 'var(--gray-600)' : 'var(--gray-900)'}">${m.title || '通知'}${!m.read ? `<span style="font-size:10px;font-weight:800;color:var(--primary-dark);background:#fff;border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:middle">未讀</span>` : ''}</div>
          <div style="font-size:13px;color:var(--gray-600);margin-top:3px;line-height:1.5">${m.body || ''}</div>
          <div style="font-size:11px;color:var(--gray-400);margin-top:6px">${m.at ? new Date(m.at).toLocaleString('zh-TW') : ''}</div>
        </div>
        ${m.type && m.type !== 'general' ? '<div style="color:var(--gray-400);font-size:16px;align-self:center">›</div>' : ''}
      </div>
    </div>`).join('')}`;
}

function goToFeedbackDay(day) {
  if (!day) { showPage('food'); return; }
  // Mark fbRead for this day
  const f = gs(`food_${currentUser.id}_${day}`);
  if (f) { f.fbRead = true; ss(`food_${currentUser.id}_${day}`, f); }
  currentFoodDay = day;
  // Find which week contains this day
  const wGroups = buildWeekGroups(buildCourseDates(currentUser.start, currentUser.end));
  const wi = wGroups.findIndex(wg => wg.dates.includes(day));
  const curWeek = wi >= 0 ? wi + 1 : 1;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-food')?.classList.add('active');
  document.getElementById('main-content').innerHTML = renderFoodEntry(day);
  window.scrollTo(0, 0);
}

// ── MENU PAGE ──
function renderMenu() {
  const allMenus = gs(`menus_${currentUser.id}`) || DEFAULT_MENUS;
  const periods = Object.keys(allMenus).map(Number).sort((a,b) => a-b);
  if (!periods.includes(currentMenuPeriod)) currentMenuPeriod = periods[0];
  const menu = allMenus[currentMenuPeriod];

  const periodTabs = periods.map(p => `
    <button class="period-tab-btn ${p === currentMenuPeriod ? 'active' : ''}" onclick="switchMenuPeriod(${p})">第 ${p} 期</button>
  `).join('');

  let daysHTML = '';
  if (!menu || !menu.days || menu.days.length === 0) {
    daysHTML = `<div class="empty-state"><div class="empty-icon">${ic('bowl',40)}</div><p>本期菜單尚未提供<br>請等待營養師上傳！</p></div>`;
  } else {
    daysHTML = menu.days.map(d => `
      <div class="menu-day-row">
        <div class="menu-day-name">週${d.name}</div>
        <div class="menu-day-content">
          ${d.breakfast ? `<div><span class="menu-meal-tag">早</span>${d.breakfast}</div>` : ''}
          ${d.lunch     ? `<div style="margin-top:5px"><span class="menu-meal-tag">午</span>${d.lunch}</div>` : ''}
          ${d.dinner    ? `<div style="margin-top:5px"><span class="menu-meal-tag">晚</span>${d.dinner}</div>` : ''}
          ${d.snack     ? `<div style="margin-top:5px"><span class="menu-meal-tag" style="background:var(--amber-light);color:#92400e">點</span>${d.snack}</div>` : ''}
          ${d.cpvfdo   ? `<div style="margin-top:6px;font-size:11px;color:var(--gray-500);background:var(--gray-50);padding:4px 8px;border-radius:6px">${ic('chart',12)} ${d.cpvfdo}</div>` : ''}
        </div>
      </div>`).join('');
  }

  return `
  <div class="page-title">客製化菜單</div>
  <div class="notice">${ic('bowl')} 根據你的飲食喜好與目標量身規劃，每期更新一次</div>
  <div class="period-tab-row">${periodTabs}</div>
  <div style="font-size:13px;color:var(--gray-500);margin-bottom:8px">${menu ? menu.label : ''}</div>
  ${menu && menu.note ? `<div style="font-size:12px;color:var(--amber);background:var(--amber-light);border-radius:8px;padding:8px 12px;margin-bottom:12px">${ic('info',13)} ${menu.note}</div>` : ''}
  <div class="card">${daysHTML}</div>
  <button class="add-period-btn" onclick="showToast('續約後由營養師在後台新增期別')">＋ 新增期別（續約後由營養師開通）</button>`;
}

function switchMenuPeriod(p) {
  currentMenuPeriod = p;
  document.getElementById('main-content').innerHTML = renderMenu();
  window.scrollTo(0, 0);
}

function renderMaterials() {
  const now = Date.now();
  const ONE_YEAR = 365 * 24 * 60 * 60 * 1000;
  const rawItems = gs(`ency_${currentUser.id}`) || [];

  const activeItems = rawItems.map(item => ({
    ...item,
    isExpired: item.uploadedAt && (now - item.uploadedAt) > ONE_YEAR,
    daysLeft: item.uploadedAt ? Math.max(0, Math.ceil((item.uploadedAt + ONE_YEAR - now) / 86400000)) : null
  })).filter(item => !item.isExpired);

  const courseItems = activeItems.filter(item => item.category === 'course');
  const encyItemsAll = activeItems.filter(item => item.category !== 'course');

  // ── Course tab HTML：改為動態清單，依營養師實際上傳的教材產生 ──
  const sortedCourseItems = [...courseItems].sort((a,b) => (a.uploadedAt||0) - (b.uploadedAt||0));
  const courseHTML = sortedCourseItems.map((item, idx) => {
    const hasLink = item.fileType === 'link' && item.linkUrl;
    const hasFile = item.fileData || item.fileUrl;
    const isClickable = hasLink || hasFile;
    const clickHandler = hasLink
      ? `onclick="window.open('${item.linkUrl}','_blank')"`
      : hasFile ? `onclick="openEncyPreview_course(${idx})"` : '';
    const statusBadge = isClickable
      ? `<span style="background:var(--primary);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap">▶ 可觀看</span>`
      : `<span style="background:var(--gray-200);color:var(--gray-400);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap">即將上線</span>`;
    const displayTitle = item.descLabel || item.title || `線上課程 ${idx+1}`;
    return `<div class="course-item" ${clickHandler} style="cursor:${isClickable?'pointer':'default'};${isClickable?'background:linear-gradient(135deg,#f0fdf4,#fff);border-left:3px solid var(--green);padding-left:12px;padding-right:8px;border-radius:0 10px 10px 0;':''}">

function renderProgressDetail(week) {
  const prog = gs(`progress_${currentUser.id}`) || getDefaultProgress(buildWeekGroups(COURSE_DATES).length || 1);
  const p = prog[week - 1] || {};
  const plan = gs(`wplan_${currentUser.id}_${week}`) || {};
  const goals = gs(`goals_${currentUser.id}_${week}`) || [];

  function parseMealLine(str) {
    if (!str) return null;
    const badges = ['C','P','V','F','D','O'];
    const parts = str.split('｜').map(s => s.trim()).filter(Boolean);
    return `<div class="cpvfdo-badges">${parts.map(part => {
      const letter = part.charAt(0);
      if (badges.includes(letter)) return `<span class="badge ${letter}">${part}</span>`;
      return `<span class="badge">${part}</span>`;
    }).join('')}</div>`;
  }

  // Calculate daily total CPVFDO from all meals
  function calcDailyTotal() {
    const keys = ['C','P','V','F','D','O'];
    const totals = {C:0,P:0,V:0,F:0,D:0,O:0};
    const mealStrings = [plan.breakfast, plan.lunch, plan.dinner, plan.snack].filter(Boolean);
    mealStrings.forEach(str => {
      str.split('｜').forEach(part => {
        const t = part.trim();
        const letter = t.charAt(0);
        if (keys.includes(letter)) {
          const num = parseFloat(t.replace(letter,'').trim());
          if (!isNaN(num)) totals[letter] += num;
        }
      });
    });
    const hasAny = Object.values(totals).some(v => v > 0);
    if (!hasAny) return null;
    return keys.map(k => totals[k] > 0 ? `${k} ${totals[k] % 1 === 0 ? totals[k] : totals[k].toFixed(1)}` : null).filter(Boolean).join('｜');
  }

  const hasMeals = plan.breakfast || plan.lunch || plan.dinner || plan.snack;
  const dailyTotal = calcDailyTotal();

  return `
  <button class="back-btn" onclick="backToBody()">‹ 返回身體數值</button>
  <div class="page-title">W${week} 本週計畫</div>

  <div class="card">
    <div class="prog-section">
      <div class="prog-section-title">${ic('calendar',13)} 基本資訊</div>
      <div class="prog-row"><span class="prog-row-label">日期</span><span class="prog-row-val">${plan.date || '---'}</span></div>
      <div class="prog-row"><span class="prog-row-label">熱量設定</span><span class="prog-row-val">${plan.calories || '---'}</span></div>
      <div class="prog-row"><span class="prog-row-label">體重</span><span class="prog-row-val">${p.weight ? p.weight + ' kg' : '尚未記錄'}</span></div>
      <div class="prog-row"><span class="prog-row-label">體脂</span><span class="prog-row-val">${p.fat ? p.fat + ' %' : '尚未記錄'}</span></div>
      <div class="prog-row"><span class="prog-row-label">腰圍</span><span class="prog-row-val">${p.waist ? p.waist + ' cm' : '尚未記錄'}</span></div>
    </div>

    <div class="divider" style="margin:4px 0 14px"></div>

    <div class="prog-section">
      <div class="prog-section-title">${ic('bowl',13)} 餐次分配（C 全穀｜P 豆魚蛋肉｜V 蔬菜｜F 水果｜D 乳品｜O 油脂）</div>
      ${hasMeals ? `
      <div class="meal-dist-grid">
        <div class="meal-dist-item">
          <div class="meal-dist-label">早餐</div>
          ${plan.breakfast ? parseMealLine(plan.breakfast) : '<div class="meal-dist-val">---</div>'}
        </div>
        <div class="meal-dist-item">
          <div class="meal-dist-label">午餐</div>
          ${plan.lunch ? parseMealLine(plan.lunch) : '<div class="meal-dist-val">---</div>'}
        </div>
        <div class="meal-dist-item">
          <div class="meal-dist-label">晚餐</div>
          ${plan.dinner ? parseMealLine(plan.dinner) : '<div class="meal-dist-val">---</div>'}
        </div>
        <div class="meal-dist-item">
          <div class="meal-dist-label">點心</div>
          ${plan.snack ? parseMealLine(plan.snack) : '<div class="meal-dist-val">---</div>'}
        </div>
      </div>
      ${dailyTotal ? `
      <div style="margin-top:12px;padding:10px 12px;background:var(--green-light);border-radius:8px;border-left:3px solid var(--green)">
        <div style="font-size:11px;font-weight:700;color:var(--primary-dark);margin-bottom:5px">${ic('chart',12)} 整天份數合計</div>
        ${parseMealLine(dailyTotal)}
      </div>` : ''}` : '<div style="color:var(--gray-400);font-size:13px;padding:8px 0">營養師尚未設定本週餐次分配</div>'}
    </div>

    <div class="divider" style="margin:4px 0 14px"></div>

    <div class="prog-section">
      <div class="prog-section-title">${ic('run',13)} 運動建議</div>
      <div style="font-size:14px;color:var(--gray-700);line-height:1.7">${plan.exercise || '---'}</div>
    </div>

    <div class="divider" style="margin:4px 0 14px"></div>

    <div class="prog-section">
      <div class="prog-section-title">${ic('note',13)} 備註（飲水、睡眠、其他注意事項）</div>
      <div style="font-size:14px;color:var(--gray-700);line-height:1.7">${plan.note || '---'}</div>
    </div>

    ${goals.length > 0 ? `
    <div class="divider" style="margin:4px 0 14px"></div>
    <div class="prog-section" style="margin-bottom:0">
      <div class="prog-section-title">${ic('target',13)} 本週小目標</div>
      ${goals.map((g, i) => `
        <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--gray-100)">
          <div onclick="toggleGoalInDetail(${i},${week})" style="width:22px;height:22px;border-radius:50%;border:2px solid ${g.done ? 'var(--primary)' : 'var(--gray-300)'};background:${g.done ? 'var(--primary)' : '#fff'};display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.2s">
            ${g.done ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
          </div>
          <div style="font-size:13px;color:${g.done ? 'var(--gray-400)' : 'var(--gray-700)'};text-decoration:${g.done ? 'line-through' : 'none'};line-height:1.5">${g.text}</div>
        </div>`).join('')}
      <div style="margin-top:8px;font-size:12px;color:var(--gray-400)">已完成 ${goals.filter(g=>g.done).length} / ${goals.length} 項</div>
    </div>` : ''}
  </div>`;
}

  const goals = gs(`goals_${currentUser.id}_${week}`) || [];
  if (!goals[i]) return;
  goals[i].done = !goals[i].done;

function handleImgUpload(event, day, mealKey) {
  const files = Array.from(event.target.files);
  if (!files.length) return;
  event.target.value = '';
  showToast('📤 壓縮並上傳中…');
  let done = 0;
  const urls = [];

  files.forEach(file => {
    const capturedMealKey = mealKey;
    const capturedDay = day;
    const img = new Image();
    const blobUrl = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 900;
      let w = img.width, h = img.height;
      if (w > h && w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      else if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(blobUrl);
      canvas.toBlob(async (blob) => {
        try {
          const url = await uploadPhoto(blob, currentUser.id, capturedDay, capturedMealKey);
          urls.push(url);
        } catch(e) {
          showToast('⚠️ 照片上傳失敗，請確認網路後重試');
        }
        done++;
        if (done === files.length) appendImgs(capturedDay, capturedMealKey, urls);
      }, 'image/jpeg', 0.75);
    };
    img.onerror = () => {
      const reader = new FileReader();
      reader.onload = e => { urls.push(e.target.result); done++; if (done === files.length) appendImgs(capturedDay, capturedMealKey, urls); };
      reader.readAsDataURL(file);
    };
    img.src = blobUrl;
  });
}

function appendImgs(day, mealKey, newImgs) {
  if (!newImgs.length) return;
  const existing = gs(`food_${currentUser.id}_${day}`) || {};
  const key = mealKey + '_imgs';
  const current = existing[key] || [];
  const combined = [...current, ...newImgs]; // no cap
  existing[key] = combined;
  ss(`food_${currentUser.id}_${day}`, existing);
  refreshImgPreview(mealKey, day, combined);
  showToast(`✅ 已上傳 ${newImgs.length} 張照片`);
}

function delMealImg(day, mealKey, idx) {
  const existing = gs(`food_${currentUser.id}_${day}`) || {};
  const key = mealKey + '_imgs';
  const imgs = existing[key] || [];
  imgs.splice(idx, 1);
  existing[key] = imgs;
  ss(`food_${currentUser.id}_${day}`, existing);
  refreshImgPreview(mealKey, day, imgs);
  showToast('🗑️ 已刪除，可重新上傳');
}

// 從 DOM 收集同一組的所有圖片 src，再開 lightbox
function clickThumb(el) {
  const mealId = el.dataset.mealid;
  const idx = parseInt(el.dataset.idx);
  // 找同一組的所有縮圖
  const siblings = document.querySelectorAll(`[data-mealid="${mealId}"]`);
  const srcs = Array.from(siblings).map(w => w.querySelector('img')?.src).filter(Boolean);
  if (srcs.length) openPhotoLightbox(srcs, idx);
}

function openPhotoLightbox(srcs, startIdx) {
  // 移除舊的
  const old = document.getElementById('img-lightbox');
  if (old) old.remove();

  const overlay = document.createElement('div');
  overlay.id = 'img-lightbox';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;';

  let cur = startIdx;
  const render = () => {
    overlay.innerHTML = `
      <button onclick="document.getElementById('img-lightbox').remove()"
        style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:26px;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)">✕</button>
      ${srcs.length > 1 ? `<div style="position:absolute;top:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.7);font-size:13px">${cur+1} / ${srcs.length}</div>` : ''}
      <img src="${srcs[cur]}" style="max-width:95vw;max-height:80vh;object-fit:contain;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.5)"
        onclick="event.stopPropagation()">
      ${srcs.length > 1 ? `
        <div style="display:flex;gap:16px;margin-top:20px">
          <button onclick="event.stopPropagation();cur=${cur > 0 ? 'cur-1' : srcs.length-1};render()" id="lb-prev"
            style="background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:20px;width:48px;height:48px;border-radius:50%;cursor:pointer;backdrop-filter:blur(4px)">‹</button>
          <button onclick="event.stopPropagation();cur=${cur < srcs.length-1 ? 'cur+1' : 0};render()" id="lb-next"
            style="background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:20px;width:48px;height:48px;border-radius:50%;cursor:pointer;backdrop-filter:blur(4px)">›</button>
        </div>` : ''}
    `;
    // Rebind arrow buttons properly
    const prev = overlay.querySelector('#lb-prev');
    const next = overlay.querySelector('#lb-next');
    if (prev) prev.onclick = (e) => { e.stopPropagation(); cur = cur > 0 ? cur-1 : srcs.length-1; render(); };
    if (next) next.onclick = (e) => { e.stopPropagation(); cur = cur < srcs.length-1 ? cur+1 : 0; render(); };
  };

  render();
  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
}

function refreshImgPreview(mealKey, day, imgs) {
  const previewRow = document.getElementById('preview-' + mealKey);
  const uploadBtns = document.getElementById('upload-btns-' + mealKey);

  if (previewRow) {
    const previewId = mealKey + '_' + day.replace(/\//g,'_');
    previewRow.innerHTML = imgs.map((src, i) => `
      <div class="img-thumb-wrap" style="cursor:zoom-in" data-mealid="${previewId}" data-idx="${i}" onclick="clickThumb(this)">
        <img class="img-thumb" src="${src}" alt="餐點照片">
        <button class="img-thumb-del" onclick="event.stopPropagation();delMealImg('${day}','${mealKey}',${i})" type="button">✕</button>
      </div>`).join('');

    // Update counter
    let counter = previewRow.nextElementSibling;
    if (counter && counter.tagName === 'DIV') {
      if (imgs.length > 0) {
        counter.textContent = `${imgs.length} 張｜點照片右上角 ✕ 可刪除`;
        counter.style.display = '';
      } else {
        counter.style.display = 'none';
      }
    }
  }
  // Upload buttons always visible — no limit
}

// ── ENCY PREVIEW — fullscreen in-app lightbox with left/right navigation ──
let _lbItems = [];   // image items currently in lightbox context
let _lbIdx = 0;      // current index within _lbItems

function openEncyPreview(idx) {
  const now = Date.now();
  const ONE_YEAR = 365 * 24 * 60 * 60 * 1000;
  const items = (gs(`ency_${currentUser.id}`) || []).filter(i => !i.uploadedAt || (now - i.uploadedAt) <= ONE_YEAR);
  const item = items[idx];
  const src = item?.fileUrl || item?.fileData;
  if (!src) { showToast('此教材無附加檔案'); return; }

  if (item.fileType === 'pdf') {
    const w = window.open();
    if (w) w.document.write(`<html><body style="margin:0"><iframe src="${src}" width="100%" height="100%" style="border:none;position:fixed;inset:0"></iframe></body></html>`);
    return;
  }

  // Build sibling image list (same category, images only)
  const catKey = item.catKey || item.desc;
  const allImages = items.map((it, i) => ({ ...it, _origIdx: i }))
    .filter(it => (it.catKey || it.desc) === catKey && it.fileType === 'image' && (it.fileUrl || it.fileData));
  // If no siblings found, just show this item alone
  _lbItems = allImages.length > 0 ? allImages : [{ ...item, _origIdx: idx }];
  _lbIdx = _lbItems.findIndex(it => it._origIdx === idx);
  if (_lbIdx < 0) _lbIdx = 0;

  renderLightbox();
}

function renderLightbox() {
  document.getElementById('img-lightbox')?.remove();

  const item = _lbItems[_lbIdx];
  if (!item) return;

  const hasPrev = _lbIdx > 0;
  const hasNext = _lbIdx < _lbItems.length - 1;

  const overlay = document.createElement('div');
  overlay.id = 'img-lightbox';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.93);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:pan-y;';

  overlay.innerHTML = `
    <button onclick="document.getElementById('img-lightbox').remove()"
      style="position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer;padding:8px;line-height:1;z-index:2">✕</button>

    ${hasPrev ? `<button onclick="lbNav(-1)"
      style="position:absolute;left:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:32px;width:48px;height:48px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;backdrop-filter:blur(4px)">‹</button>` : ''}

    ${hasNext ? `<button onclick="lbNav(1)"
      style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:32px;width:48px;height:48px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;backdrop-filter:blur(4px)">›</button>` : ''}

    <img src="${item.fileUrl || item.fileData}" style="max-width:88vw;max-height:82vh;object-fit:contain;border-radius:4px;user-select:none" draggable="false">

    <div style="color:rgba(255,255,255,0.65);font-size:12px;margin-top:10px;display:flex;align-items:center;gap:12px">
      <span>${item.fileName || ''}</span>
      <span style="background:rgba(255,255,255,0.15);padding:2px 8px;border-radius:10px">${_lbIdx+1} / ${_lbItems.length}</span>
    </div>`;

  // Tap outside to close
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

  document.body.appendChild(overlay);

  // Pinch-to-zoom + pan + swipe
  const img = overlay.querySelector('img');
  let scale = 1, lastScale = 1;
  let panX = 0, panY = 0, lastPanX = 0, lastPanY = 0;
  let initDist = 0;
  let touchStartX = 0, touchStartY = 0;
  let isPinching = false;

  function applyTransform() {
    img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    img.style.maxWidth = 'none';
    img.style.maxHeight = 'none';
    img.style.width = '88vw';
    img.style.height = 'auto';
  }

  function resetTransform() {
    scale = 1; panX = 0; panY = 0;
    img.style.transform = '';
    img.style.maxWidth = '88vw';
    img.style.maxHeight = '82vh';
    img.style.width = '';
  }

  overlay.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      isPinching = true;
      initDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      lastScale = scale;
      lastPanX = panX; lastPanY = panY;
    } else if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      lastPanX = panX; lastPanY = panY;
      isPinching = false;
    }
  }, { passive: true });

  overlay.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      scale = Math.min(5, Math.max(1, lastScale * dist / initDist));
      applyTransform();
    } else if (e.touches.length === 1 && scale > 1) {
      e.preventDefault();
      panX = lastPanX + (e.touches[0].clientX - touchStartX);
      panY = lastPanY + (e.touches[0].clientY - touchStartY);
      applyTransform();
    }
  }, { passive: false });

  overlay.addEventListener('touchend', e => {
    if (isPinching) { isPinching = false; return; }
    if (scale <= 1) {
      // Swipe to navigate
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        resetTransform();
        lbNav(dx < 0 ? 1 : -1);
      }
    }
    // Double-tap to reset
    if (scale > 1 && e.changedTouches.length === 1) {
      const now = Date.now();
      if (now - (overlay._lastTap || 0) < 300) { resetTransform(); }
      overlay._lastTap = now;
    }
  }, { passive: true });

  // Keyboard support
  overlay._keyHandler = e => {
    if (e.key === 'ArrowLeft') lbNav(-1);
    else if (e.key === 'ArrowRight') lbNav(1);
    else if (e.key === 'Escape') overlay.remove();
  };
  document.addEventListener('keydown', overlay._keyHandler);
  overlay.addEventListener('remove', () => document.removeEventListener('keydown', overlay._keyHandler));
}

function lbNav(dir) {
  const next = _lbIdx + dir;
  if (next < 0 || next >= _lbItems.length) return;
  _lbIdx = next;
  renderLightbox();
}

function openEncyPreview_course(idx) {
  const now = Date.now();
  const ONE_YEAR = 365 * 24 * 60 * 60 * 1000;
  const rawItems = gs(`ency_${currentUser.id}`) || [];
  const activeCourseItems = rawItems
    .filter(i => i.category === 'course' && (!i.uploadedAt || (now - i.uploadedAt) <= ONE_YEAR))
    .sort((a,b) => (a.uploadedAt||0) - (b.uploadedAt||0));
  const item = activeCourseItems[idx];
  if (!item) { showToast('課程影片即將上線，敬請期待！'); return; }
  if (item.linkUrl) { window.open(item.linkUrl, '_blank'); return; }
  const src = item.fileUrl || item.fileData;
  if (!src) { showToast('此課程尚無附件'); return; }
  if (item.fileType === 'pdf') {
    const w = window.open();
    if (w) w.document.write(`<html><body style="margin:0"><iframe src="${src}" width="100%" height="100%" style="border:none;position:fixed;inset:0"></iframe></body></html>`);
  } else {
    const w = window.open();
    if (w) w.document.write(`<html><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${src}" style="max-width:100%;max-height:100vh;object-fit:contain"></body></html>`);
  }
}
</script>
